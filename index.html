<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>돼지우리 당직일지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap');
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111813;color:#f7efd8;font-family:'Nanum Gothic',sans-serif;overflow:hidden}
#game{display:block;width:100vw;height:100vh;image-rendering:auto}
.hud{position:absolute;pointer-events:none}.top{top:17px;left:20px;right:20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge,.panel{background:#14251fe8;border:2px solid #9eaa75;border-radius:14px;box-shadow:0 5px 0 #0b1410,0 12px 28px #0008;padding:10px 15px}.brand{font:27px Jua;color:#ffe8a7}.sub{font-size:12px;color:#b9c9ad;margin-top:3px}.stats{display:flex;gap:8px}.stat{min-width:92px;text-align:center;font-size:11px;color:#c1cdb7}.stat strong{display:block;font:23px Jua;color:#fff3c4}.bottom{bottom:18px;left:20px;right:20px;display:flex;align-items:end;justify-content:space-between;gap:16px}.panel{max-width:530px;line-height:1.5}.panel b{font:20px Jua;color:#ffdc83}.panel small{color:#c6d1bb}.keys{font-size:13px}.key{display:inline-block;background:#e7d5ae;color:#273126;border-radius:5px;padding:1px 6px;font-weight:800;box-shadow:0 3px #a19273;margin:0 2px}.toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:#fff0be;color:#273128;border:3px solid #855c3d;border-radius:12px;padding:10px 18px;font:19px Jua;box-shadow:0 5px #392e21;transition:opacity .25s;pointer-events:none;text-align:center;max-width:85vw}.toast.hide{opacity:0}.hint{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);background:#26382beF;border:2px solid #f4ce85;border-radius:9px;padding:9px 16px;font:19px Jua;pointer-events:none;white-space:nowrap}.mobile{display:none;position:absolute;bottom:20px;right:20px;gap:8px;align-items:end}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}button{touch-action:none;border:2px solid #fff1c1;background:#435e46;color:white;font:23px Jua;border-radius:10px;box-shadow:0 4px #1c3022}.action{width:76px;height:76px;background:#ca864c}button:active{transform:translateY(3px);box-shadow:0 1px #1c3022}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:3;grid-row:2}.dpad button:nth-child(4){grid-column:2;grid-row:3}@media(max-width:800px){.top{left:9px;right:9px;top:8px}.brand{font-size:19px}.stats{gap:3px}.stat{min-width:50px;font-size:9px}.stat strong{font-size:17px}.badge{padding:6px}.bottom{left:9px;bottom:9px}.bottom .panel{font-size:11px;max-width:53%;padding:8px}.keys{display:none}.hint{bottom:157px;font-size:15px}.mobile{display:flex}.sub{display:none}}
</style></head><body>
<canvas id="game"></canvas>
<div class="hud top"><div class="badge"><div class="brand">🐽 돼지우리 당직일지</div><div class="sub">오늘도 평화로운(?) 축사 관리 · WASD/방향키 이동 · E 상호작용</div></div><div class="stats"><div class="badge stat">근무 시간<strong id="clock">00:00</strong></div><div class="badge stat">돌본 돼지<strong id="care">0</strong></div><div class="badge stat">평화 지수<strong id="peace">100</strong></div></div></div>
<div class="hud bottom"><div class="panel"><b id="headline">당직 시작!</b><br><small id="detail">먹이통을 살피고 돼지들을 돌봐주세요.</small></div><div class="panel keys"><span class="key">W A S D</span> 이동　<span class="key">E</span> 상호작용　<span class="key">R</span> 다시 시작<br><small>가까운 대상에 따라 행동이 바뀝니다. 돼지와 함께 주차장까지 걸어가세요.</small></div></div>
<div id="toast" class="toast hide"></div><div id="hint" class="hint" hidden></div>
<div class="mobile"><div class="dpad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="right">▶</button><button data-dir="down">▼</button></div><button class="action" id="act">E</button></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id), W=1600,H=900;
let scale=1,ox=0,oy=0;
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let player,pigs,troughs,elapsed,care,peace,incident,feedTimer,fightTimer,challengeTimer,medicalTimer,toastUntil,near,particles;
function reset(){player={x:720,y:490,face:1};troughs=[{x:370,y:343,food:100},{x:920,y:343,food:100},{x:370,y:620,food:100},{x:920,y:620,food:100}];pigs=[];for(let i=0;i<19;i++)pigs.push({x:rand(210,1120),y:rand(260,715),vx:0,vy:0,phase:rand(0,7),size:rand(18,25),color:['#e8aaa1','#dc9790','#f3b7a7','#a97970'][i%4],state:'normal',name:['꿀이','복실','도토','막내','통통','장군','콩이','분홍','누룽'][i%9],wander:0});elapsed=0;care=0;peace=100;incident=null;feedTimer=0;fightTimer=17;challengeTimer=29;medicalTimer=45;particles=[];message('당직 시작!','먹이통을 살피고 돼지들을 돌봐주세요.');showToast('오늘의 축사 당직을 시작합니다!')}reset();
function message(a,b){$('headline').textContent=a;$('detail').textContent=b}
function showToast(s){$('toast').textContent=s;$('toast').classList.remove('hide');toastUntil=elapsed+3}
const keys=new Set();addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='e'||k===' ')interact();if(k==='r')reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('[data-dir]').forEach(b=>{let k=b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();keys.add(k)};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys.delete(k)});$('act').onpointerdown=e=>{e.preventDefault();interact()};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function getNear(){let options=[];for(const t of troughs)if(dist(player,t)<92)options.push({d:dist(player,t),type:'trough',item:t,label:'사료통 리필'});for(const p of pigs){if(p.state==='fight'&&dist(player,p)<90)options.push({d:dist(player,p),type:'fight',item:p,label:'작대기로 바닥을 탁! 싸움 말리기'});if(p.state==='medical'&&dist(player,p)<90)options.push({d:dist(player,p),type:'medical',item:p,label:'아픈 돼지 진료실로 보내기'});if(p.state==='challenge'&&dist(player,p)<95)options.push({d:dist(player,p),type:'challenge',item:p,label:'도전하는 돼지 주차장으로 데려가기'});if(p.state==='following'&&player.x>1220&&player.y>540)options.push({d:0,type:'parking',item:p,label:'포터에 태워 안전하게 이동'});if(p.state==='normal'&&dist(player,p)<62)options.push({d:dist(player,p)+20,type:'pet',item:p,label:p.name+' 쓰다듬기'})}return options.sort((a,b)=>a.d-b.d)[0]}
function burst(x,y,label,color='#ffe7a8'){particles.push({x,y,label,color,life:1.6})}
function interact(){let n=getNear();if(!n)return;const p=n.item;if(n.type==='trough'){p.food=100;care+=2;peace=clamp(peace+4,0,100);burst(p.x,p.y-35,'사료 보충!');message('사료 리필 완료','아기 돼지들이 신나게 달려옵니다.');showToast('사료통을 가득 채웠어요!')}
if(n.type==='fight'){const group=pigs.filter(q=>q.state==='fight');group.forEach(q=>{q.state='normal';q.vx=rand(-100,100);q.vy=rand(-80,80)});care+=3;peace=clamp(peace+7,0,100);burst(p.x,p.y-40,'탁! 해산!');message('싸움 중재 성공','바닥을 탁 쳤더니 서로 멀찍이 떨어졌습니다.');showToast('작대기로 바닥을 탁! 모두 해산!')}
if(n.type==='medical'){p.state='gone';care+=4;peace=clamp(peace+5,0,100);burst(p.x,p.y-35,'진료실 이동');message('진료실 이송','아픈 돼지를 수의사에게 안전하게 맡겼습니다.');showToast('수의사에게 연락하고 진료실로 이동했어요.')}
if(n.type==='challenge'){p.state='following';p.vx=0;p.vy=0;message('주차장으로 이동 중',p.name+'가 뒤따라옵니다. 오른쪽 주차장으로 가세요.');showToast('도전장을 접수! 포터가 기다리는 주차장으로.')}
if(n.type==='parking'){p.state='gone';care+=5;peace=clamp(peace+7,0,100);burst(1350,630,'새 우리로 출발!');message('포터 탑승 완료',p.name+'가 넓은 새 우리로 출발했습니다.');showToast('부릉! 안전하게 새 우리로 이동!')}
if(n.type==='pet'){care++;peace=clamp(peace+1,0,100);burst(p.x,p.y-30,'♥');showToast(p.name+'가 기분 좋게 꿀꿀!')}}
function spawnIncident(type){const available=pigs.filter(p=>p.state==='normal');if(!available.length)return;const p=available[Math.floor(Math.random()*available.length)];if(type==='fight'&&available.length>1){let q=available.filter(x=>x!==p).sort((a,b)=>dist(a,p)-dist(b,p))[0];p.state=q.state='fight';q.x=clamp(p.x+45,205,1130);q.y=p.y;message('돼지들 싸움!','붉은 표시가 뜬 돼지 곁에서 E로 싸움을 말리세요.');showToast('⚠ 돼지들이 서로 으르렁거립니다!')}else if(type==='medical'){p.state='medical';message('건강 확인 필요','아픈 돼지를 진료실로 보내주세요.');showToast('⚕ '+p.name+'의 상태를 살펴주세요.')}else if(type==='challenge'){p.state='challenge';message('도전장 등장!',p.name+'를 주차장으로 데려가세요.');showToast('⚡ '+p.name+'가 당직자에게 도전합니다!')}}
function update(dt){elapsed+=dt;feedTimer+=dt;fightTimer-=dt;challengeTimer-=dt;medicalTimer-=dt;if(fightTimer<=0){spawnIncident('fight');fightTimer=rand(22,36)}if(challengeTimer<=0){spawnIncident('challenge');challengeTimer=rand(38,55)}if(medicalTimer<=0){spawnIncident('medical');medicalTimer=rand(48,70)}
let dx=(keys.has('d')||keys.has('arrowright')||keys.has('right')?1:0)-(keys.has('a')||keys.has('arrowleft')||keys.has('left')?1:0),dy=(keys.has('s')||keys.has('arrowdown')||keys.has('down')?1:0)-(keys.has('w')||keys.has('arrowup')||keys.has('up')?1:0);let len=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/len*245*dt,85,1515);player.y=clamp(player.y+dy/len*245*dt,175,805);if(dx)player.face=dx;
for(const t of troughs){t.food=Math.max(0,t.food-dt*1.15);if(t.food===0)peace=clamp(peace-dt*.65,0,100)}
for(const p of pigs){if(p.state==='gone')continue;p.phase+=dt*4;p.wander-=dt;if(p.state==='normal'&&p.wander<=0){p.vx=rand(-28,28);p.vy=rand(-23,23);p.wander=rand(1,3)}if(p.state==='following'){let tx=player.x-42*player.face,ty=player.y+23;let d=Math.hypot(tx-p.x,ty-p.y);p.vx=d>38?(tx-p.x)/d*150:0;p.vy=d>38?(ty-p.y)/d*150:0}if(p.state==='fight'){peace=clamp(peace-dt*.11,0,100);p.vx=Math.sin(elapsed*7+p.phase)*18;p.vy=Math.cos(elapsed*8+p.phase)*16}if(p.state==='challenge'){p.vx=Math.sin(elapsed*2+p.phase)*28;p.vy=0}if(p.state==='medical'){p.vx=p.vy=0}p.x=clamp(p.x+p.vx*dt,185,1150);p.y=clamp(p.y+p.vy*dt,245,735)}
particles=particles.filter(p=>(p.life-=dt)>0);for(const p of particles)p.y-=dt*22;
near=getNear();$('hint').hidden=!near;if(near)$('hint').textContent='[E] '+near.label;$('clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('care').textContent=care;$('peace').textContent=Math.floor(peace);if(elapsed>toastUntil)$('toast').classList.add('hide');if(feedTimer>7){feedTimer=0;if(troughs.some(t=>t.food<18))message('밥이 거의 없어요!','사료통에 다가가 E를 눌러 리필하세요.')}} 
function round(x,y,w,h,r,fill,stroke,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function text(s,x,y,size=20,color='#f4e8bb',align='center'){ctx.font=size+'px Jua';ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y)}
function pig(p){let x=p.x,y=p.y+Math.sin(p.phase)*2,s=p.size;ctx.save();ctx.translate(x,y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,s*.64,s*1.24,s*.32,0,0,7);ctx.fill();ctx.fillStyle=p.color;ctx.strokeStyle='#835e59';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,s*1.13,s*.78,0,0,7);ctx.fill();ctx.stroke();for(let a of [-1,1]){ctx.beginPath();ctx.ellipse(a*s*.65,-s*.68,s*.28,s*.34,a*.3,0,7);ctx.fill();ctx.stroke()}ctx.fillStyle='#f4beb0';ctx.beginPath();ctx.ellipse(0,s*.23,s*.52,s*.38,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#865856';for(let a of [-1,1]){ctx.beginPath();ctx.arc(a*s*.22,s*.23,2.5,0,7);ctx.fill()}ctx.fillStyle='#352f2d';for(let a of [-1,1]){ctx.beginPath();ctx.arc(a*s*.46,-s*.17,2.5,0,7);ctx.fill()}ctx.restore();if(p.state==='fight'||p.state==='challenge'||p.state==='medical')text(p.state==='fight'?'⚡':p.state==='challenge'?'❗':'✚',x,y-s-18,29,p.state==='medical'?'#aee9f5':'#f26357');if(p.state==='following')text('따라오는 중',x,y-s-17,15)}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#17241d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,ox,oy);
ctx.fillStyle='#6a855a';ctx.fillRect(0,0,W,H);for(let i=0;i<170;i++){let x=(i*457+97)%W,y=(i*173+83)%H;ctx.fillStyle=i%3?'#779363':'#86a36a';ctx.fillRect(x,y,3,9)}
round(105,171,1095,637,18,'#b4976d','#5b4634',9);round(131,196,1044,583,10,'#bdac83','#705f48',4);
for(let i=0;i<27;i++){let x=155+(i*181)%990,y=220+(i*271)%530;round(x,y,30,4,2,i%2?'#c7b88c':'#a89570')}
round(1195,456,340,330,16,'#5e6460','#d8c39e',6);for(let i=0;i<3;i++)round(1240+i*97,496,3,236,0,'#e9e3cd');
round(1268,585,179,100,15,'#6895a8','#233e4b',4);round(1287,568,115,51,12,'#7eb1bc','#233e4b',4);round(1284,588,111,32,6,'#9ec6c7');for(let x of [1304,1414]){ctx.fillStyle='#242b2d';ctx.beginPath();ctx.arc(x,687,17,0,7);ctx.fill();ctx.fillStyle='#abb7ad';ctx.beginPath();ctx.arc(x,687,8,0,7);ctx.fill()}text('PORTER',1358,655,20,'#f5eee2');
ctx.strokeStyle='#69523c';ctx.lineWidth=10;for(let y of [278,470,752]){ctx.beginPath();ctx.moveTo(155,y);ctx.lineTo(1160,y);ctx.stroke()}for(let x of [160,650,1165]){ctx.beginPath();ctx.moveTo(x,200);ctx.lineTo(x,780);ctx.stroke()}ctx.setLineDash([12,14]);ctx.strokeStyle='#d7c498';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(650,475);ctx.lineTo(650,750);ctx.stroke();ctx.setLineDash([]);
for(const t of troughs){round(t.x-55,t.y-20,110,49,8,'#4b6262','#314044',4);round(t.x-45,t.y-11,90,28,5,'#806a47');round(t.x-45,t.y-11,90*t.food/100,28,5,t.food<20?'#9b503b':'#d6ae65');text(Math.round(t.food)+'%',t.x,t.y+9,17,'#fff5cb');if(t.food<20){text('♪ 꿀꿀! 밥!',t.x,t.y-35,18,'#a73935')}}
let sorted=pigs.filter(p=>p.state!=='gone').sort((a,b)=>a.y-b.y);for(const p of sorted)pig(p);
ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(player.x,player.y+24,24,9,0,0,7);ctx.fill();ctx.fillStyle='#314938';ctx.fillRect(player.x-13,player.y+7,10,19);ctx.fillRect(player.x+4,player.y+7,10,19);round(player.x-17,player.y-20,34,32,7,'#e7c977','#5f5439',2);ctx.fillStyle='#f4d0ac';ctx.beginPath();ctx.arc(player.x,player.y-28,15,0,7);ctx.fill();round(player.x-19,player.y-43,38,10,3,'#416b51');round(player.x-14,player.y-49,28,9,3,'#416b51');ctx.fillStyle='#39332a';ctx.beginPath();ctx.arc(player.x+player.face*5,player.y-29,2,0,7);ctx.fill();
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life);text(p.label,p.x,p.y,24,p.color)}ctx.globalAlpha=1;
text('축사 A',382,243,25,'#66533d');text('축사 B',920,243,25,'#66533d');text('주차장',1360,484,27,'#f1e4c0');text('진료실 →',90,432,20,'#f1e4c0','left');
if(near){ctx.strokeStyle='#fff5bf';ctx.lineWidth=3;ctx.beginPath();ctx.arc(near.item.x,near.item.y,39+Math.sin(elapsed*5)*3,0,7);ctx.stroke()}}
let prev=performance.now();function frame(now){let dt=Math.min((now-prev)/1000,.05);prev=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
