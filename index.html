<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>돼지우리 당직일지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap');
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111813;color:#f7efd8;font-family:'Nanum Gothic',sans-serif;overflow:hidden}
#game{display:block;width:100vw;height:100vh;image-rendering:auto}
.hud{position:absolute;pointer-events:none}.top{top:17px;left:20px;right:20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge,.panel{background:#14251fe8;border:2px solid #9eaa75;border-radius:14px;box-shadow:0 5px 0 #0b1410,0 12px 28px #0008;padding:10px 15px}.brand{font:27px Jua;color:#ffe8a7}.sub{font-size:12px;color:#b9c9ad;margin-top:3px}.stats{display:flex;gap:8px}.stat{min-width:92px;text-align:center;font-size:11px;color:#c1cdb7}.stat strong{display:block;font:23px Jua;color:#fff3c4}.bottom{bottom:18px;left:20px;right:20px;display:flex;align-items:end;justify-content:space-between;gap:16px}.panel{max-width:530px;line-height:1.5}.panel b{font:20px Jua;color:#ffdc83}.panel small{color:#c6d1bb}.keys{font-size:13px}.key{display:inline-block;background:#e7d5ae;color:#273126;border-radius:5px;padding:1px 6px;font-weight:800;box-shadow:0 3px #a19273;margin:0 2px}.toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:#fff0be;color:#273128;border:3px solid #855c3d;border-radius:12px;padding:10px 18px;font:19px Jua;box-shadow:0 5px #392e21;transition:opacity .25s;pointer-events:none;text-align:center;max-width:85vw}.toast.hide{opacity:0}.hint{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);background:#26382beF;border:2px solid #f4ce85;border-radius:9px;padding:9px 16px;font:19px Jua;pointer-events:none;white-space:nowrap}.mobile{display:none;position:absolute;bottom:20px;right:20px;gap:8px;align-items:end}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}button{touch-action:none;border:2px solid #fff1c1;background:#435e46;color:white;font:23px Jua;border-radius:10px;box-shadow:0 4px #1c3022}.action{width:76px;height:76px;background:#ca864c}button:active{transform:translateY(3px);box-shadow:0 1px #1c3022}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:3;grid-row:2}.dpad button:nth-child(4){grid-column:2;grid-row:3}@media(max-width:800px){.top{left:9px;right:9px;top:8px}.brand{font-size:19px}.stats{gap:3px}.stat{min-width:50px;font-size:9px}.stat strong{font-size:17px}.badge{padding:6px}.bottom{left:9px;bottom:9px}.bottom .panel{font-size:11px;max-width:53%;padding:8px}.keys{display:none}.hint{bottom:157px;font-size:15px}.mobile{display:flex}.sub{display:none}}
</style></head><body>
<canvas id="game"></canvas>
<div class="hud top"><div class="badge"><div class="brand">🐽 돼지우리 당직일지</div><div class="sub">오늘도 평화로운(?) 축사 관리 · WASD/방향키 이동 · E 상호작용 · Q 작대기</div></div><div class="stats"><div class="badge stat">근무 시간<strong id="clock">00:00</strong></div><div class="badge stat">사료 포대<strong id="bags">0/4</strong></div><div class="badge stat">돌본 돼지<strong id="care">0</strong></div><div class="badge stat">평화 지수<strong id="peace">100</strong></div></div></div>
<div class="hud bottom"><div class="panel"><b id="headline">당직 시작!</b><br><small id="detail">창고에서 포대를 들고, 먹이통 주변 돼지들을 살펴보세요.</small></div><div class="panel keys"><span class="key">W A S D</span> 이동　<span class="key">E</span> 상호작용　<span class="key">Q</span> 작대기　<span class="key">R</span> 다시 시작<br><small>가까운 대상에 따라 행동이 바뀝니다. 돼지와 함께 주차장까지 걸어가세요.</small></div></div>
<div id="toast" class="toast hide"></div><div id="hint" class="hint" hidden></div>
<div class="mobile"><div class="dpad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="right">▶</button><button data-dir="down">▼</button></div><button class="action" id="swing">Q</button><button class="action" id="act">E</button></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id), W=1600,H=900;
let scale=1,ox=0,oy=0;
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let player,pigs,troughs,elapsed,care,peace,incident,fightSeq,feedTimer,fightTimer,challengeTimer,medicalTimer,birthTimer,ketchupTimer,swingUntil,toastUntil,near,particles,splats;
function reset(){player={x:720,y:490,face:1,feed:0,carrying:null};troughs=[{x:370,y:343,food:100},{x:920,y:343,food:100},{x:370,y:620,food:100},{x:920,y:620,food:100}];pigs=[];for(let i=0;i<19;i++)pigs.push({x:rand(210,1120),y:rand(260,715),vx:0,vy:0,phase:rand(0,7),size:rand(18,25),color:['#e8aaa1','#dc9790','#f3b7a7','#a97970'][i%4],state:'normal',name:['꿀이','복실','도토','막내','통통','장군','콩이','분홍','누룽'][i%9],wander:0});elapsed=0;care=0;peace=100;incident=null;fightSeq=0;feedTimer=0;fightTimer=17;challengeTimer=29;medicalTimer=45;birthTimer=27;ketchupTimer=0;swingUntil=0;particles=[];splats=[];message('당직 시작!','먹이통을 살피고 돼지들을 돌봐주세요.');showToast('오늘의 축사 당직을 시작합니다!')}reset();
function message(a,b){$('headline').textContent=a;$('detail').textContent=b}
function showToast(s){$('toast').textContent=s;$('toast').classList.remove('hide');toastUntil=elapsed+3}
const keys=new Set();function stepKey(k){let v={w:[0,-1],arrowup:[0,-1],s:[0,1],arrowdown:[0,1],a:[-1,0],arrowleft:[-1,0],d:[1,0],arrowright:[1,0]}[k];if(!v)return;let n=26*(245-player.feed*31)/245;player.x=clamp(player.x+v[0]*n,85,1515);player.y=clamp(player.y+v[1]*n,175,805);if(v[0])player.face=v[0]}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!e.repeat)stepKey(k);if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='e'||k===' ')interact();if(k==='q'&&!e.repeat)swing();if(k==='r')reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('[data-dir]').forEach(b=>{let k=b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();keys.add(k)};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys.delete(k)});$('act').onpointerdown=e=>{e.preventDefault();interact()};$('swing').onpointerdown=e=>{e.preventDefault();swing()};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function getNear(){let options=[];if(dist(player,{x:115,y:565})<115&&player.carrying)options.push({d:0,type:'freezer',item:{x:115,y:565},label:'냉동창고에 눕혀 냉찜질'});if(dist(player,{x:1350,y:328})<105)options.push({d:dist(player,{x:1350,y:328}),type:'warehouse',item:{x:1350,y:328},label:player.feed>=4?'포대 4개 · 더 들 수 없음':'창고에서 사료 포대 가져오기 ('+player.feed+'/4)'});for(const t of troughs)if(dist(player,t)<92)options.push({d:dist(player,t),type:'trough',item:t,label:player.feed?'사료 포대 붓기':'사료 포대 필요 · 오른쪽 창고로!'});for(const p of pigs){if(p.state==='fight'&&dist(player,p)<90)options.push({d:dist(player,p),type:'fight',item:p,label:'작대기로 바닥을 탁! 싸움 말리기'});if(p.state==='newbornCare'&&dist(player,p)<90)options.push({d:dist(player,p),type:'newbornCare',item:p,label:'Q · 새끼 돼지 편히 보내기'});if(p.state==='incapacitated'&&dist(player,p)<88&&!player.carrying)options.push({d:dist(player,p),type:'carry',item:p,label:'행동 불가 돼지 들어 옮기기'});if(p.state==='medical'&&dist(player,p)<90&&!player.carrying)options.push({d:dist(player,p),type:'medical',item:p,label:'아픈 돼지 들어 냉동창고로 옮기기'});if(p.state==='challenge'&&dist(player,p)<95)options.push({d:dist(player,p),type:'challenge',item:p,label:'도전하는 돼지 주차장으로 데려가기'});if(p.state==='victory'&&player.x>1220&&player.y>520)options.push({d:0,type:'parking',item:p,label:'승리! 포터로 편히 보내기'});if(p.state==='normal'&&dist(player,p)<62)options.push({d:dist(player,p)+20,type:'pet',item:p,label:p.name+' 기선제압'})}return options.sort((a,b)=>a.d-b.d)[0]}
function burst(x,y,label,color='#ffe7a8'){particles.push({x,y,label,color,life:1.6})}
function interact(){let n=getNear();if(!n)return;const p=n.item;if(n.type==='warehouse'){if(player.feed>=4){showToast('사료 포대는 최대 4개까지 들 수 있어요!');return}player.feed++;burst(1350,290,'포대 '+player.feed+'/4');showToast('사료 포대 '+player.feed+'개를 들었습니다. 이동 속도가 느려집니다.')}if(n.type==='trough'){if(!player.feed){showToast('창고에서 사료 포대를 가져와야 해요!');return}player.feed--;p.food=100;care+=2;peace=clamp(peace+4,0,100);burst(p.x,p.y-35,'사료 보충!');message('사료 리필 완료','아기 돼지들이 신나게 달려옵니다.');showToast('사료통을 가득 채웠어요!')}
if(n.type==='freezer'){player.carrying.state='cooling';player.carrying.x=115;player.carrying.y=565;player.carrying=null;care+=4;peace=clamp(peace+2,0,100);burst(115,525,'냉찜질 시작','#bce9ff');message('냉동창고에서 냉찜질 중','돼지를 차가운 침상에 눕혀 돌보고 있습니다.');showToast('냉동창고에서 냉찜질을 시작했어요.')}if(n.type==='carry'){p.state='carried';player.carrying=p;message('돼지 이송 중','왼쪽 냉동창고로 데려가 E를 누르세요.');showToast('조심히 들어 올렸어요. 냉동창고로 가세요.')}if(n.type==='fight'){showToast('Q로 작대기를 휘둘러 싸움을 말려주세요!')}
if(n.type==='newbornCare'){showToast('Q로 작대기를 사용하세요.')}if(n.type==='medical'){p.state='carried';player.carrying=p;message('아픈 돼지 이송 중','왼쪽 냉동창고로 데려가 E를 누르세요.');showToast('아픈 돼지를 조심히 들었습니다. 냉동창고로 가세요.')}
if(n.type==='challenge'){p.state='following';p.vx=0;p.vy=0;message('주차장으로 이동 중',p.name+'가 뒤따라옵니다. 포터 앞에서 대결이 시작됩니다.');showToast('도전장을 접수! 포터가 기다리는 주차장으로.')}
if(n.type==='parking'){p.state='gone';care+=5;peace=clamp(peace+7,0,100);burst(1350,630,'포터로 편히 이동');message('대결 승리 · 포터 출발',p.name+'가 포터에 올라 편히 떠났습니다.');showToast('승리! 포터로 편히 보냈어요.')}
if(n.type==='pet'){p.flee=1.25;let a=Math.atan2(p.y-player.y,p.x-player.x);p.vx=Math.cos(a)*140;p.vy=Math.sin(a)*140;care++;burst(p.x,p.y-30,'끼익!', '#ffe9bc');showToast(p.name+' 기선제압! 끼익!')}}
function swing(){if(elapsed<swingUntil)return;swingUntil=elapsed+.38;
let baby=pigs.find(p=>p.state==='newbornCare'&&dist(player,p)<90);
if(baby){baby.state='gone';care+=4;burst(baby.x,baby.y-25,'안녕, 아가');message('조용한 작별','새끼 돼지를 편히 보냈습니다.');showToast('작대기를 사용해 조용히 편히 보냈습니다.')}
let nearby=pigs.filter(p=>!['gone','medical','newbornCare','incapacitated','carried','cooling','duel','victory'].includes(p.state)&&dist(player,p)<145),fights=0;
for(const p of nearby){if(p.state==='fight'){p.state='normal';fights++}let a=Math.atan2(p.y-player.y,p.x-player.x);if(dist(player,p)<2)a=rand(-Math.PI,Math.PI);p.vx=Math.cos(a)*175;p.vy=Math.sin(a)*175;p.flee=1.4;burst(p.x,p.y-36,'끼익!', '#ffe9bc')}
if(fights){care+=3;peace=clamp(peace+7,0,100);message('싸움 해산!','작대기를 휘두르자 주변 돼지들이 놀라 멀어졌습니다.')}
burst(player.x+player.face*42,player.y-12,'휙!');
showToast(nearby.length?'주변 돼지 '+nearby.length+'마리가 끼익! 하며 도망갑니다.':'작대기를 허공에 휘둘렀습니다.')}
function spawnIncident(type){const available=pigs.filter(p=>p.state==='normal');if(!available.length)return;const p=available[Math.floor(Math.random()*available.length)];if(type==='fight'&&available.length>1){let q=available.filter(x=>x!==p).sort((a,b)=>dist(a,p)-dist(b,p))[0];p.state=q.state='fight';p.fightId=q.fightId=++fightSeq;p.fightEnd=q.fightEnd=elapsed+10;q.x=clamp(p.x+45,205,1130);q.y=p.y;message('돼지들 싸움!','10초 안에 Q로 말리세요. 늦으면 한 마리가 행동 불가가 됩니다.');showToast('⚠ 돼지들이 서로 으르렁거립니다!')}else if(type==='medical'){p.state='medical';message('건강 확인 필요','아픈 돼지를 진료실로 보내주세요.');showToast('⚕ '+p.name+'의 상태를 살펴주세요.')}else if(type==='challenge'){p.state='challenge';message('도전장 등장!',p.name+'를 주차장으로 데려가세요.');showToast('⚡ '+p.name+'가 당직자에게 도전합니다!')}}
function update(dt){elapsed+=dt;feedTimer+=dt;fightTimer-=dt;challengeTimer-=dt;medicalTimer-=dt;birthTimer-=dt;ketchupTimer-=dt;if(birthTimer<=0){let mother=pigs.filter(p=>p.state==='normal'&&p.size>17)[Math.floor(Math.random()*pigs.filter(p=>p.state==='normal'&&p.size>17).length)];if(mother){let affected=Math.random()<.15;let baby={x:clamp(mother.x+32,185,1150),y:mother.y+18,vx:0,vy:0,phase:0,size:11,color:'#f2b6aa',state:affected?'newbornCare':'normal',name:'아기 돼지',wander:0};pigs.push(baby);burst(baby.x,baby.y-28,affected?'돌봄 필요':'아기 탄생!');message(affected?'돌봄이 필요한 새끼 탄생':'새끼 돼지 탄생!',affected?'표시된 새끼 돼지를 살펴주세요.':'축사 가족이 늘었습니다!');showToast(affected?'새끼 돼지의 상태를 확인하세요.':'🐽 새끼 돼지가 태어났어요!')}birthTimer=rand(32,47)}if(fightTimer<=0){spawnIncident('fight');fightTimer=rand(22,36)}for(const p of pigs){if(p.state==='fight'&&p.fightEnd<=elapsed){let pair=pigs.filter(q=>q.state==='fight'&&q.fightId===p.fightId);if(pair.length){let down=pair[Math.floor(Math.random()*pair.length)];for(const q of pair){q.state=q===down?'incapacitated':'normal';q.vx=q.vy=0;q.flee=0}peace=clamp(peace-8,0,100);burst(down.x,down.y-42,'행동 불가','#bce9ff');message('싸움을 늦게 말렸어요',down.name+'가 행동 불가 상태입니다. 왼쪽 냉동창고에서 냉찜질시켜 주세요.');showToast('⚠ '+down.name+'를 냉동고로 옮겨야 해요.')}}}if(challengeTimer<=0){spawnIncident('challenge');challengeTimer=rand(38,55)}if(medicalTimer<=0){spawnIncident('medical');medicalTimer=rand(48,70)}
let dx=(keys.has('d')||keys.has('arrowright')||keys.has('right')?1:0)-(keys.has('a')||keys.has('arrowleft')||keys.has('left')?1:0),dy=(keys.has('s')||keys.has('arrowdown')||keys.has('down')?1:0)-(keys.has('w')||keys.has('arrowup')||keys.has('up')?1:0);let len=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/len*(245-player.feed*31)*dt,85,1515);player.y=clamp(player.y+dy/len*(245-player.feed*31)*dt,175,805);if(dx)player.face=dx;
for(const t of troughs){let eaters=pigs.filter(p=>!['gone','medical','newbornCare','incapacitated','carried','cooling'].includes(p.state)&&dist(p,t)<125).length;if(eaters)t.food=Math.max(0,t.food-dt*(.25+eaters*.52));if(t.food===0&&eaters)peace=clamp(peace-dt*.65,0,100)}
for(const p of pigs){if(p.state==='gone'||p.state==='carried'||p.state==='cooling')continue;p.phase+=dt*4;p.wander-=dt;if(p.flee>0){p.flee-=dt;p.vx*=Math.max(0,1-dt*.7);p.vy*=Math.max(0,1-dt*.7);p.x=clamp(p.x+p.vx*dt,185,1150);p.y=clamp(p.y+p.vy*dt,245,735);continue}if(p.state==='normal'&&p.wander<=0){p.vx=rand(-28,28);p.vy=rand(-23,23);p.wander=rand(1,3)}if(p.state==='following'){let tx=player.x-42*player.face,ty=player.y+23;let d=Math.hypot(tx-p.x,ty-p.y);p.vx=d>38?(tx-p.x)/d*150:0;p.vy=d>38?(ty-p.y)/d*150:0;if(player.x>1240&&player.y>520&&d<110){p.state='duel';p.duelEnd=elapsed+2.4;p.x=player.x+55;p.y=player.y-8;p.vx=p.vy=0;message('주차장 대결!',p.name+'의 도전! 승부는 잠시 뒤 결정됩니다.');showToast('⚔ 포터 앞에서 대결 시작!')}}if(p.state==='duel'){p.vx=p.vy=0;if(elapsed>=p.duelEnd){p.state='victory';care+=2;burst(p.x,p.y-55,'내 승리!','#fff3ad');message('대결 승리!',p.name+'가 패배를 인정했습니다. 포터 앞에서 E로 편히 보내세요.');showToast('당신의 완승! E로 포터에 태우세요.')}}if(p.state==='victory'){p.vx=p.vy=0}if(p.state==='fight'){peace=clamp(peace-dt*.11,0,100);p.vx=Math.sin(elapsed*7+p.phase)*18;p.vy=Math.cos(elapsed*8+p.phase)*16}if(p.state==='challenge'){p.vx=Math.sin(elapsed*2+p.phase)*28;p.vy=0}if(p.state==='medical'||p.state==='newbornCare'||p.state==='incapacitated'){p.vx=p.vy=0}p.x=clamp(p.x+p.vx*dt,185,['following','duel','victory'].includes(p.state)?1490:1150);p.y=clamp(p.y+p.vy*dt,245,['following','duel','victory'].includes(p.state)?780:735)}
